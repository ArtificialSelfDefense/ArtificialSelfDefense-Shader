#讀blue noise
customTexture.blue_noise_tex = textures/blue_noise.png


#不開別想 存/讀 voxel
iris.features.required = CUSTOM_IMAGES
#體素的其中一個存放位置在shadow.fsh/vsh，不開沒法讀
shadow.enabled=true
#確保體素在身後不要被切掉
shadow.culling=reversed

#定義體素空間大小

#if Voxel_Area == 128
	image.voxelImage = VoxelSampler RED_INTEGER R32UI UNSIGNED_INT true false 128 128 128
#endif
#if Voxel_Area == 64
	image.voxelImage = VoxelSampler RED_INTEGER R32UI UNSIGNED_INT true false 64 64 64
#endif
#if Voxel_Area == 32
	image.voxelImage = VoxelSampler RED_INTEGER R32UI UNSIGNED_INT true false 32 32 32
#endif




#遊戲設定開關
screen = \
    [denoise] \
    [sspt] \
    Ambient_Strength \
    [voxelization]

screen.sspt = \
    Ray_Max_Step \
    Ray_Step_Size \
    Avoid_Fuck_Bright_Value \
    Indirect_Light_Strengh \
    Min_Penetration_Depth \
    Thickness \
    Ray_Start_Bias \
    Indirect_Light_Reflection_Rate \
    Sspt

screen.denoise = \
    Bilateral_Denoise

screen.voxelization = \
    Voxel_Area

sliders = \
    Ray_Max_Step \
    Ray_Step_Size \
    Avoid_Fuck_Bright_Value \
    Indirect_Light_Strengh \
    Ambient_Strength \
    Min_Penetration_Depth \
    Thickness \
    Ray_Start_Bias \
    Indirect_Light_Reflection_Rate \
    Voxel_Area
